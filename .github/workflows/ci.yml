name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The quality gates never reach a model registry; keep them fully offline so a
  # network hiccup cannot turn into a red build.
  HF_HUB_OFFLINE: "1"

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock has drifted from pyproject.toml, so lockfile
        # staleness is caught here rather than at image build time.
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      - name: Test
        # The ONNX parity test needs the optional extra plus exported artifacts and
        # skips itself here; everything else runs offline.
        run: uv run pytest -q

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        # docker-compose bind-mounts the source over the image in normal use, so the
        # image is never exercised locally. Building it here is what keeps it working.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: docsrag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image runs as a non-root user
        run: |
          test "$(docker run --rm --entrypoint sh docsrag-api:ci -c 'id -un')" = "appuser"

      - name: Verify the application imports
        run: |
          docker run --rm --entrypoint python docsrag-api:ci -c "import api.main; print('import ok')"
