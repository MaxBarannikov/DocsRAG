[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docsrag"
version = "0.1.0"
description = "Self-hosted RAG system for technical documentation Q&A"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maxim Barannikov" }]
keywords = ["rag", "llm", "mlops", "qdrant", "langchain", "fastapi"]


dependencies = [
    "fastapi>=0.136.1",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.17.1",
    "langgraph>=0.2.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "uvicorn>=0.34.0",
    "langfuse>=4.5.1",
    "langchain-openai>=1.2.1",
]

[project.optional-dependencies]
# Evaluation only. Kept out of the runtime dependencies so the API image does not
# ship mlflow's server stack (Flask, gunicorn, SQLAlchemy, Alembic, pandas, scipy).
eval = [
    "mlflow>=2.18.0",
    "ragas>=0.2.0",
]
dev = [
    "pre-commit>=4.5.1",
    "mypy>=1.19.1",
    "ruff>=0.15.12",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.27.0",  # required by fastapi.testclient
    "types-pyyaml>=6.0",
]
onnx = [
    # optimum 2.x split the ONNX exporter into its own package (optimum-onnx).
    # We list both explicitly — the `[exporters]` extra from optimum 1.x is gone.
    "optimum>=2.0.0",
    "optimum-onnx>=0.1.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.18.0",
]

[project.urls]
Repository = "https://github.com/PureLeach/DocsRAG"
Issues = "https://github.com/PureLeach/DocsRAG/issues"

# The Docker image runs on CPU, but PyPI's linux torch wheel bundles the full CUDA
# runtime (~2 GB of nvidia-* packages) that would never be used. Pull the CPU build
# there instead. macOS keeps the default PyPI wheel, which is what provides MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
include = ["api*", "core*", "embeddings*", "indexing*", "evaluation*"]

[tool.setuptools.package-data]
evaluation = ["golden_dataset.json"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
# Only the benchmark scripts are exempt: they reload modules and swap backends at
# runtime in ways the type checker cannot follow.
exclude = "(^benchmarks/)"

# Tests deliberately pass stubs and partially-built objects where production types are
# expected, so full annotations there would mean typing every fixture against private
# library types. Real type errors are still reported; only the "annotate everything"
# rules are relaxed.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_incomplete_defs = false
disallow_untyped_defs = false
check_untyped_defs = true


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint]
select = [
    "F",        # Pyflakes (unused imports, undefined variables)
    "E",        # pycodestyle error (syntax and indentation errors)
    "W",        # pycodestyle warning (style-related warnings)
    "C90",      # mccabe (checks for functions with a high McCabe complexity)
    "I",        # isort (import conventions)
    "N",        # pep8-naming (naming conventions)
    "UP",       # pyupgrade (compatibility with newer Python versions)
    "YTT",      # flake8-2020 (detects usage of features removed in Python 3.9 and later)
    "ANN",      # flake8-annotations (enforces function annotations)
    "ASYNC",    # flake8-async (checks for correct usage of async functions)
    "S",        # flake8-bandit (checks for common security issues in Python code)
    "BLE",      # flake8-blind-except (detects broad except clauses)
    "FBT",      # flake8-boolean-trap (detects boolean traps)
    "B",        # flake8-bugbear (identifies common coding mistakes and bugs)
    "A",        # flake8-builtins (checks for shadowing Python builtins names)
    "COM",      # flake8-commas (checks for proper usage of commas)
    "C4",       # flake8-comprehensions (suggests more efficient comprehension syntax)
    "DTZ",      # flake8-datetimez (checks for unsafe use of naive datetime objects without timezone awareness)
    "T10",      # flake8-debugger (detects use of debugger-related statements like `pdb.set_trace()`)
    "EM",       # flake8-errmsg (enforces consistency in error messages)
    "EXE",      # flake8-executable (checks for executable permissions on files)
    "FA",       # flake8-future-annotations (enforces future-style type annotations)
    "ISC",      # flake8-implicit-str-concat (warns about implicit string concatenation)
    "ICN",      # flake8-import-conventions (checks for proper import ordering and style)
    "LOG",      # flake8-logging (enforces consistent use of logging)
    "G",        # flake8-logging-format (checks for consistent logging format)
    "INP",      # flake8-no-pep420 (warns if a module contains `__init__.py` and uses PEP 420 namespace)
    "PIE",      # flake8-pie (suggests Python Improvement Proposal checks)
    "T20",      # flake8-print (checks for print statements in production code)
    "PYI",      # flake8-pyi (checks for `.pyi` files, typically type hint files)
    "PT",       # flake8-pytest-style (checks for pytest-specific code style issues)
    "Q",        # flake8-quotes (enforces consistent use of quotes for strings)
    "RSE",      # flake8-raise (checks for proper usage of `raise` statements)
    "RET",      # flake8-return (enforces consistent return statements)
    "SLF",      # flake8-self (enforces usage of `self` in methods within classes)
    "SLOT",     # flake8-slots (enforces the usage of `__slots__` in classes to optimize memory)
    "SIM",      # flake8-simplify (suggests ways to simplify code)
    "TID",      # flake8-tidy-imports (checks for tidy import statements)
    "TC",       # flake8-type-checking (ensures compatibility with type-checking tools)
    "INT",      # flake8-gettext (ensures compatibility with gettext for internationalization)
    "ARG",      # flake8-unused-arguments (warns about unused function arguments)
    "PTH",      # flake8-use-pathlib (encourages usage of `pathlib` over `os.path`)
    "TD",       # flake8-todos (checks for TODO comments in the code)
    "FIX",      # flake8-fixme (checks for FIXME comments in the code)
    "ERA",      # eradicate (removes commented-out code)
    "PD",       # pandas-vet (checks for pandas-specific coding practices)
    "PGH",      # pygrep-hooks (applies custom grep hooks for specific patterns)
    "PL",       # Pylint (standard pylint checks)
    "FLY",      # flynt (automates the conversion of string formatting to f-strings)
    "NPY",      # NumPy-specific rules (checks for NumPy-specific best practices)
    "FAST",     # FastAPI (checks for FastAPI-specific issues)
    "PERF",     # Perflint (checks for performance-related issues)
    "FURB",     # refurb (suggests refactoring opportunities)
    "RUF",      # Ruff-specific rules (Ruff's own rules for static analysis)
    "TRY",      # tryceratops (checks for best practices and anti-patterns in try/except blocks)
]

ignore = [
    "ANN401",   # allow dynamically typed expressions (Any) where a precise type adds nothing
    "COM812",   # missing trailing comma — conflicts with the formatter
    "ISC001",   # implicitly concatenated strings on one line — conflicts with the formatter
    "RUF001",   # ambiguous unicode characters (the project deliberately uses Cyrillic in tests/prompts)
    "RUF002",   # ambiguous unicode characters in docstrings
    "RUF003",   # ambiguous unicode characters in comments
    "PLR0913",  # allow many arguments; the pipeline constructors legitimately take several
    "TRY003",   # allow message text at the raise site when it names concrete values
    "EM101",    # allow string literals in exceptions raised via a `msg` variable
    "PLC0415",  # function-level imports are deliberate here: they keep optional extras
                # ([onnx], vLLM) and heavy dependencies (torch) off the import path
                # until something actually needs them. Each site says why in a comment.
]


[tool.ruff.lint.extend-per-file-ignores]
# Prompt text is content, not code: re-wrapping a line changes what the model receives.
"api/prompts.py" = ["E501"]
# Operational scripts and benchmarks print to stdout by design and are run by hand.
"scripts/*" = ["T201", "PLR0912", "PLR0915", "C901"]
"benchmarks/*" = ["T201", "PLR0912", "PLR0915", "C901"]
# Tests reach into internals on purpose and do not need return annotations everywhere.
"tests/*" = ["S101", "SLF001", "ANN001", "ANN201", "ANN202", "PLR2004", "ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# pytest-asyncio 1.x defaults to strict mode, which silently skips unmarked coroutines.
asyncio_mode = "auto"
markers = [
    "slow: needs real models or a fetched corpus; skipped automatically when unavailable",
]
