# DocsRAG infrastructure stack.
#
# Ollama runs natively on the host so it can use Metal GPU acceleration; the API
# container reaches it at http://host.docker.internal:11434. Running Ollama inside
# Docker instead is possible but CPU-only on Apple Silicon — see the "Running Ollama
# in Docker" section of README.md.

services:
  qdrant:
    image: qdrant/qdrant:v1.17
    container_name: docsrag-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      # /healthz is plain HTTP 200 with no body — works with default slim image
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docsrag-api
    ports:
      - "8000:8000"
    environment:
      # Qdrant lives in this compose network — use the service name.
      QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-docsrag}"
      # Ollama runs natively on the host; the container reaches it via
      # host.docker.internal (mapped below in extra_hosts).
      INFERENCE_BACKEND: "${INFERENCE_BACKEND:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:7b-instruct-q4_K_M}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:-http://host.docker.internal:8001/v1}"
      VLLM_MODEL: "${VLLM_MODEL:-mlx-community/Qwen2.5-7B-Instruct-4bit}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-384}"
      EMBEDDER_BACKEND: "${EMBEDDER_BACKEND:-pytorch}"
      EMBEDDER_ONNX_FP32_PATH: "${EMBEDDER_ONNX_FP32_PATH:-models/bge-small-en-v1.5-onnx-fp32}"
      EMBEDDER_ONNX_INT8_PATH: "${EMBEDDER_ONNX_INT8_PATH:-models/bge-small-en-v1.5-onnx-int8}"
      QDRANT_COLLECTION_INT8: "${QDRANT_COLLECTION_INT8:-docsrag_int8}"
      HF_TOKEN: "${HF_TOKEN}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"
      RETRIEVAL_STRATEGY: "${RETRIEVAL_STRATEGY:-dense}"
      API_KEY: "${API_KEY:-}"
    extra_hosts:
      # Required on Linux for host.docker.internal to resolve.
      # On Docker Desktop (macOS) it's already mapped, but specifying it
      # explicitly makes the compose file portable. Harmless on macOS.
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist HuggingFace model cache so we don't redownload bge-small
      # on every container rebuild.
      - hf_cache:/app/.cache/huggingface
      # Bind-mount source so code edits apply via `make restart` (no rebuild).
      # Because these shadow the code baked into the image, the image itself is
      # never exercised locally — CI builds and smoke-tests it instead.
      # Read-only — container doesn't write into these. PYTHONDONTWRITEBYTECODE=1
      # in the Dockerfile keeps Python from trying to write .pyc files.
      # NB: bind mounts override the COPY'd code from the image; if you ever
      # want to test the image as-built, remove these two lines.
      - ./api:/app/api:ro
      - ./core:/app/core:ro
      - ./indexing:/app/indexing:ro
      - ./embeddings:/app/embeddings:ro
      # Exported ONNX models live in ./models/ (gitignored). Needed when
      # EMBEDDER_BACKEND=onnx-fp32 or onnx-int8 — the directories referenced
      # by EMBEDDER_ONNX_*_PATH must be visible to the container.
      - ./models:/app/models:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      # Defined in the Dockerfile; repeated here only to give it a longer start
      # period, since the first run downloads the embedding model.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: docsrag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    container_name: docsrag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/docsrag.json"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Used only by the host-side evaluation harness; the API does not talk to it.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: docsrag-mlflow
    ports:
      - "${MLFLOW_PORT:-5555}:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

networks:
  default:
    name: docsrag-network

volumes:
  qdrant_storage:
  hf_cache:
  mlflow_data:
  prometheus_data:
  grafana_data:
